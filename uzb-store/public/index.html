<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>UZB STORE — Ilovalar olami</title><style>
:root{--bg:#0b1220;--panel:#142238;--muted:#9eacc0;--line:#293b54;--green:#25cf91}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% -10%,#16423d,transparent 45%),var(--bg);color:#f4f7fb;font:15px system-ui,Arial}header{position:sticky;top:0;background:#0b1220ed;border-bottom:1px solid var(--line);z-index:3}.wrap{max-width:1100px;margin:auto;padding:17px 22px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900;letter-spacing:-1px}.brand span{color:var(--green)}button,.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--green);color:#052318;font-weight:800;cursor:pointer;text-decoration:none}.ghost{background:#22334b;color:white}.hero{padding:48px 0 24px}.hero h1{font-size:clamp(36px,6vw,60px);line-height:1.02;margin:12px 0}.muted{color:var(--muted)}.search{display:flex;gap:9px;margin-top:22px}.search input,.field input,.field textarea,.field select{width:100%;background:#0e1a2c;color:white;border:1px solid var(--line);border-radius:10px;padding:13px;font:inherit}.search input{max-width:520px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chip{background:#1b2b42;color:white;border:1px solid var(--line);border-radius:50px;padding:8px 13px}.chip.active{background:#15513d}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}.card{background:linear-gradient(145deg,#182941,#111d30);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;gap:13px;min-height:148px}.ico{width:58px;height:58px;border-radius:14px;object-fit:cover;background:#30425a;flex-shrink:0}.card h3{margin:2px 0 5px}.card p{color:var(--muted);font-size:13px;line-height:1.4}.card .btn{font-size:12px;padding:9px 11px}.admin{margin:35px 0;background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:17px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:grid;gap:6px}.field label{font-size:13px;color:var(--muted)}.full{grid-column:1/-1}.list{display:grid;gap:8px;margin-top:15px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px;background:#0d192a;border-radius:9px}.danger{background:#8d3444;color:white}footer{text-align:center;color:var(--muted);padding:28px;border-top:1px solid var(--line);margin-top:45px}@media(max-width:600px){.wrap{padding:15px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.hero{padding-top:30px}.item{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div class="wrap top"><div class="brand">UZB <span>STORE</span></div><button class="ghost" onclick="document.querySelector('#admin').scrollIntoView({behavior:'smooth'})">Admin panel</button></div></header><main class="wrap"><section class="hero"><div class="muted">O‘ZBEKISTONNING ILOVALAR DO‘KONI</div><h1>Ilovalar olami<br><span style="color:var(--green)">bir joyda.</span></h1><p class="muted">Ilovalar va o‘yinlarni toping, tanlang va yuklab oling.</p><div class="search"><input id="q" placeholder="Ilova yoki o‘yin qidirish..." oninput="load()"><button onclick="load()">Qidirish</button></div><div class="filters" id="filters"></div></section><h2>Ilovalar katalogi</h2><p class="muted" id="count">Yuklanmoqda...</p><div class="grid" id="apps"></div>
<section class="admin" id="admin"><h2>🔐 Admin panel</h2><p class="muted">Faqat sayt egasi ilovalarni boshqaradi.</p><div id="loginbox"><div class="field"><label>Admin paroli</label><input id="password" type="password" placeholder="Admin paroli"></div><button style="margin-top:10px" onclick="login()">Kirish</button></div><div id="dash" hidden><div class="formgrid"><div class="field"><label>Ilova nomi *</label><input id="name"></div><div class="field"><label>Kategoriya</label><select id="category"><option>Ilova</option><option>O‘yin</option><option>Asboblar</option><option>Ta’lim</option><option>Hosildorlik</option><option>Ko‘ngilochar</option></select></div><div class="field"><label>Versiya</label><input id="version" value="1.0"></div><div class="field"><label>Ikonka URL</label><input id="icon" placeholder="https://..."></div><div class="field full"><label>Tavsif</label><textarea id="description" rows="3"></textarea></div><div class="field full"><label>Rasmiy sayt yoki APK URL *</label><input id="download_url" placeholder="https://rasmiy-sayt-yoki-apk.uz"></div><div><label><input id="featured" type="checkbox" style="width:auto"> Tavsiya etilgan</label></div></div><p><button onclick="save()">Ilova qo‘shish</button> <button class="ghost" onclick="logout()">Chiqish</button></p><p class="muted" id="msg">Havolaga faqat o‘zing tarqatishga ruxsatli fayllarni joyla.</p><div class="list" id="list"></div></div></section></main><footer>© <span id="year"></span> UZB STORE</footer><script>
let token=localStorage.getItem('uzb-token')||'',filter='',editing=null;const cats=['Barchasi','Ilova','O‘yin','Asboblar','Ta’lim','Hosildorlik','Ko‘ngilochar'];document.getElementById('year').textContent=new Date().getFullYear();
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function filters(){document.getElementById('filters').innerHTML=cats.map(c=>'<button class="chip '+((filter||'Barchasi')===c?'active':'')+'" onclick="setFilter('+JSON.stringify(c)+')">'+esc(c)+'</button>').join('')}function setFilter(c){filter=c==='Barchasi'?'':c;filters();load()}
async function load(){try{const d=await(await fetch('/api/apps?q='+encodeURIComponent(q.value)+'&category='+encodeURIComponent(filter))).json();count.textContent=d.length+' ta natija';apps.innerHTML=d.length?d.map(a=>'<article class="card"><img class="ico" src="'+esc(a.icon||'https://placehold.co/120?text=APP')+'" onerror="this.src=\'https://placehold.co/120?text=APP\'"><div><h3>'+esc(a.name)+'</h3><small class="muted">'+esc(a.category)+' · v'+esc(a.version)+'</small><p>'+esc(a.description)+'</p><a class="btn" href="'+esc(a.download_url)+'" target="_blank" rel="noopener">↗ Ilovani ochish</a></div></article>').join(''):'<p class="muted">Hozircha ilovalar yo‘q.</p>';if(token)adminList(d)}catch(e){apps.textContent='Serverga ulanib bo‘lmadi.'}}
const headers=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token});
async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})}),d=await r.json();if(!r.ok)return alert(d.error);token=d.token;localStorage.setItem('uzb-token',token);showDash()}
function showDash(){loginbox.hidden=true;dash.hidden=false;load()}async function logout(){await fetch('/api/admin/logout',{method:'POST',headers:headers()});token='';localStorage.removeItem('uzb-token');loginbox.hidden=false;dash.hidden=true}
async function save(){try{const b={name:name.value.trim(),category:category.value,version:version.value,icon:icon.value.trim(),description:description.value,download_url:download_url.value.trim(),featured:featured.checked};const r=await fetch(editing?'/api/apps/'+editing:'/api/apps',{method:editing?'PUT':'POST',headers:headers(),body:JSON.stringify(b)});const d=await r.json().catch(()=>({error:'Server javobi noto‘g‘ri'}));if(r.status===401){msg.textContent='Admin sessiyasi tugagan. Qayta kiring.';await logout();return}if(!r.ok){msg.textContent=d.error||'Saqlashda xatolik';return}editing=null;['name','icon','description','download_url'].forEach(x=>document.getElementById(x).value='');version.value='1.0';featured.checked=false;msg.textContent='Ilova muvaffaqiyatli saqlandi!';load()}catch(e){msg.textContent='Serverga ulanib bo‘lmadi. Internetni tekshiring.'}}
function adminList(d){list.innerHTML=d.map(a=>'<div class="item"><b>'+esc(a.name)+'</b><span><button class="ghost" onclick="edit('+a.id+')">Tahrirlash</button> <button class="danger" onclick="del('+a.id+')">O‘chirish</button></span></div>').join('')}
async function edit(id){const d=await(await fetch('/api/apps')).json(),a=d.find(x=>x.id===id);editing=id;['name','category','version','icon','description','download_url','featured'].forEach(k=>{const e=document.getElementById(k);if(e.type==='checkbox')e.checked=!!a[k];else e.value=a[k]||''});msg.textContent='Tahrirlash rejimi'}
async function del(id){if(!confirm('Ilova o‘chirilsinmi?'))return;const r=await fetch('/api/apps/'+id,{method:'DELETE',headers:headers()});if(r.ok)load()}
filters();if(token)showDash();load();
</script></body></html>
